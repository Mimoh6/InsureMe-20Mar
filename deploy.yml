---
- name: Configure Docker on Deployserver
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Python 3 and pip
      apt:
        name:
          - python3
          - python3-pip
        state: present

    - name: Create pip symlink for compatibility (optional)
      file:
        src: /usr/bin/pip3
        dest: /usr/bin/pip
        state: link
        force: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Deploy the image from DockerHub and run as container
      command: docker run -itd -p 8080:8081 mimoh6/insurance:latest

